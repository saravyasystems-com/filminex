name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filminex
          POSTGRES_USER: filminex
          POSTGRES_PASSWORD: filminex-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filminex -d filminex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FILMINEX_DB_HOST: localhost
      FILMINEX_DB_PORT: 5432
      FILMINEX_DB_NAME: filminex
      FILMINEX_DB_USER: filminex
      FILMINEX_DB_PASSWORD: filminex-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify
        run: ./gradlew test
