spring:
  application:
    name: filminex-api
  datasource:
    url: jdbc:postgresql://${FILMINEX_DB_HOST:localhost}:${FILMINEX_DB_PORT:5432}/${FILMINEX_DB_NAME:filminex}
    username: ${FILMINEX_DB_USER:filminex}
    password: ${FILMINEX_DB_PASSWORD:filminex-local}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${FILMINEX_DB_POOL_SIZE:10}
  flyway:
    default-schema: filminex
    schemas: filminex
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always

info:
  application:
    name: Filminex API
    description: The backend foundation for the Filmmaking Workspace
